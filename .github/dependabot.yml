version: 2

# This file is the source projected into repositories that use GitHub Actions.
# Cooldown gives a compromised release time to be yanked or flagged before an
# automated PR proposes it.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

# GitHub Actions is the only moving dependency here. The grammar is vendored
# (see UPSTREAM.md) and updated by hand under supply-chain review, so there is
# no swift block.
